openapi: 3.0.3
info:
  title: stag.io API
  version: 1.0.0
  description: API documentation for the stag.io backend (authentication, student & company profiles)
servers:
  - url: https://stag-io-8.onrender.com
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        student_profile:
          $ref: '#/components/schemas/StudentProfile'
        company_profile:
          $ref: '#/components/schemas/CompanyProfile'
    StudentProfile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        wilaya:
          type: string
        university:
          type: string
        field_of_study:
          type: string
        academic_level:
          type: string
        skills:
          type: array
          items:
            type: string
        portfolio_link:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CompanyProfile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        company_name:
          type: string
        industry:
          type: string
        location:
          type: string
        website_url:
          type: string
        company_size:
          type: string
          description: One of "1-10","11-50","51-200","201-500","500+"
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InternshipOffer:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
        domain:
          type: string
        location:
          type: string
        type:
          type: string
          enum: ["présentiel","télétravail","hybride"]
        duration_unit:
          type: string
          enum: ["weeks","months"]
        duration_value:
          type: integer
        required_skills:
          type: array
          items:
            type: string
        status:
          type: string
          enum: ["open","closed"]
        deadline:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        role:
          type: string
        user:
          $ref: '#/components/schemas/User'
paths:
  /api/register:
    post:
      summary: Register a new user (student or company)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name,email,password,password_confirmation,role]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                password_confirmation:
                  type: string
                role:
                  type: string
                  enum: [student,company,admin]
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation error
  /api/login:
    post:
      summary: Login and receive an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email,password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
  /api/me:
    get:
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
  /api/logout:
    post:
      summary: Revoke current token (logout)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
  /api/student/profile:
    get:
      summary: Get authenticated student's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '403':
          description: Forbidden (wrong role)
        '404':
          description: Profile not found
    put:
      summary: Update authenticated student's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                wilaya: { type: string }
                university: { type: string }
                field_of_study: { type: string }
                academic_level: { type: string }
                skills:
                  type: array
                  items:
                    type: string
                portfolio_link: { type: string }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '403':
          description: Forbidden (wrong role)
  /api/company/profile:
    get:
      summary: Get authenticated company's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '403':
          description: Forbidden (wrong role)
        '404':
          description: Profile not found
    put:
      summary: Update authenticated company's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name: { type: string }
                industry: { type: string }
                location: { type: string }
                website_url: { type: string }
                company_size:
                  type: string
                  enum: ["1-10","11-50","51-200","201-500","500+"]
                description: { type: string }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '403':
          description: Forbidden (wrong role)
  /api/students/{id}/cv:
    get:
      summary: Public view of a student's CV/profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Public student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '404':
          description: Not found
  /api/companies/{id}:
    get:
      summary: Public view of a company profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Public company profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '404':
          description: Not found
  /api/offers:
    get:
      summary: List public internship offers with optional filters
      parameters:
        - in: query
          name: wilaya
          schema:
            type: string
          description: Filter by wilaya / location
        - in: query
          name: domain
          schema:
            type: string
          description: Filter by domain
        - in: query
          name: type
          schema:
            type: string
            enum: ["présentiel","télétravail","hybride"]
          description: Filter by internship type
        - in: query
          name: skill
          schema:
            type: string
          description: Filter by required skill
      responses:
        '200':
          description: Paginated list of internship offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternshipOffer'
                  current_page: { type: integer }
                  last_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
  /api/offers/{id}:
    get:
      summary: Get a single internship offer (public)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Internship offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer:
                    $ref: '#/components/schemas/InternshipOffer'
        '404':
          description: Offer not found
  /api/company/offers:
    get:
      summary: List internship offers created by the authenticated company
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated list of the company's internship offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternshipOffer'
                  current_page: { type: integer }
                  last_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
        '401':
          description: Unauthenticated
    post:
      summary: Create a new internship offer (company only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title,description,domain,location,type,duration_unit,duration_value]
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: string }
                domain: { type: string, maxLength: 255 }
                location: { type: string, maxLength: 255 }
                type:
                  type: string
                  enum: ["présentiel","télétravail","hybride"]
                duration_unit:
                  type: string
                  enum: ["weeks","months"]
                duration_value:
                  type: integer
                  minimum: 1
                required_skills:
                  type: array
                  items:
                    type: string
                deadline:
                  type: string
                  format: date
      responses:
        '201':
          description: Offer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  offer:
                    $ref: '#/components/schemas/InternshipOffer'
        '401':
          description: Unauthenticated
        '422':
          description: Validation error
  /api/company/offers/{id}:
    put:
      summary: Update an existing internship offer (company only, must own offer)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: string }
                domain: { type: string, maxLength: 255 }
                location: { type: string, maxLength: 255 }
                type:
                  type: string
                  enum: ["présentiel","télétravail","hybride"]
                duration_unit:
                  type: string
                  enum: ["weeks","months"]
                duration_value:
                  type: integer
                  minimum: 1
                required_skills:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                  enum: ["open","closed"]
                deadline:
                  type: string
                  format: date
      responses:
        '200':
          description: Offer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  offer:
                    $ref: '#/components/schemas/InternshipOffer'
        '401':
          description: Unauthenticated
        '404':
          description: Offer not found or not owned by the company
    delete:
      summary: Delete an internship offer (company only, must own offer)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Offer deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401':
          description: Unauthenticated
        '404':
          description: Offer not found or not owned by the company
