openapi: 3.0.3
info:
  title: stag.io API
  version: 1.0.0
  description: API documentation for the stag.io backend (authentication, student & company profiles)
tags:
  - name: Auth
    description: Authentication and user bootstrap
  - name: Student
    description: Student-only endpoints
  - name: Company
    description: Company-only endpoints
  - name: Admin
    description: Administration-only endpoints
  - name: Public
    description: Public, unauthenticated endpoints
  - name: Conventions
    description: Convention de stage generation and download
servers:
  - url: https://stag-io-8.onrender.com
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        student_profile:
          $ref: '#/components/schemas/StudentProfile'
        company_profile:
          $ref: '#/components/schemas/CompanyProfile'
    StudentProfile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        wilaya:
          type: string
        university:
          type: string
        field_of_study:
          type: string
        academic_level:
          type: string
        skills:
          type: array
          items:
            type: string
        portfolio_link:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CompanyProfile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        company_name:
          type: string
        industry:
          type: string
        location:
          type: string
        website_url:
          type: string
        company_size:
          type: string
          description: One of "1-10","11-50","51-200","201-500","500+"
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InternshipOffer:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
        domain:
          type: string
        location:
          type: string
        type:
          type: string
          enum: ["présentiel","télétravail","hybride"]
        duration_unit:
          type: string
          enum: ["weeks","months"]
        duration_value:
          type: integer
        required_skills:
          type: array
          items:
            type: string
        status:
          type: string
          enum: ["open","closed"]
        deadline:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Application:
      type: object
      properties:
        id:
          type: integer
        student_id:
          type: integer
        offer_id:
          type: integer
        status:
          type: string
          enum: ["pending","accepted","refused","validated","rejected"]
        cover_letter:
          type: string
          nullable: true
        admin_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        role:
          type: string
        user:
          $ref: '#/components/schemas/User'
paths:
  /api/register:
    post:
      tags: ["Auth"]
      summary: Register a new user (student or company)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name,email,password,password_confirmation,role]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                password_confirmation:
                  type: string
                role:
                  type: string
                  enum: [student,company,admin]
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation error
  /api/login:
    post:
      tags: ["Auth"]
      summary: Login and receive an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email,password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
  /api/create-admin:
    post:
      tags: ["Auth"]
      summary: Create an admin user (utility endpoint)
      description: >
        Creates a new admin user with the provided name, email, and password.
        Intended for initial setup via Swagger UI. In production you should
        protect or remove this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name,email,password]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '201':
          description: Admin created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '422':
          description: Validation error (e.g. email already taken)
  /api/me:
    get:
      tags: ["Auth"]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
  /api/logout:
    post:
      tags: ["Auth"]
      summary: Revoke current token (logout)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
  /api/student/profile:
    get:
      tags: ["Student"]
      summary: Get authenticated student's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '403':
          description: Forbidden (wrong role)
        '404':
          description: Profile not found
    put:
      tags: ["Student"]
      summary: Update authenticated student's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                wilaya: { type: string }
                university: { type: string }
                field_of_study: { type: string }
                academic_level: { type: string }
                skills:
                  type: array
                  items:
                    type: string
                portfolio_link: { type: string }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '403':
          description: Forbidden (wrong role)
  /api/company/profile:
    get:
      tags: ["Company"]
      summary: Get authenticated company's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '403':
          description: Forbidden (wrong role)
        '404':
          description: Profile not found
    put:
      tags: ["Company"]
      summary: Update authenticated company's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name: { type: string }
                industry: { type: string }
                location: { type: string }
                website_url: { type: string }
                company_size:
                  type: string
                  enum: ["1-10","11-50","51-200","201-500","500+"]
                description: { type: string }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '403':
          description: Forbidden (wrong role)
  /api/students/{id}/cv:
    get:
      tags: ["Public"]
      summary: Public view of a student's CV/profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Public student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '404':
          description: Not found
  /api/companies/{id}:
    get:
      tags: ["Public"]
      summary: Public view of a company profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Public company profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '404':
          description: Not found
  /api/offers:
    get:
      tags: ["Public"]
      summary: List public internship offers with optional filters
      parameters:
        - in: query
          name: wilaya
          schema:
            type: string
          description: Filter by wilaya / location
        - in: query
          name: domain
          schema:
            type: string
          description: Filter by domain
        - in: query
          name: type
          schema:
            type: string
            enum: ["présentiel","télétravail","hybride"]
          description: Filter by internship type
        - in: query
          name: skill
          schema:
            type: string
          description: Filter by required skill
      responses:
        '200':
          description: Paginated list of internship offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternshipOffer'
                  current_page: { type: integer }
                  last_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
  /api/offers/{id}:
    get:
      tags: ["Public"]
      summary: Get a single internship offer (public)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Internship offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer:
                    $ref: '#/components/schemas/InternshipOffer'
        '404':
          description: Offer not found
  /api/company/offers:
    get:
      tags: ["Company"]
      summary: List internship offers created by the authenticated company
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated list of the company's internship offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternshipOffer'
                  current_page: { type: integer }
                  last_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
        '401':
          description: Unauthenticated
    post:
      tags: ["Company"]
      summary: Create a new internship offer (company only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title,description,domain,location,type,duration_unit,duration_value]
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: string }
                domain: { type: string, maxLength: 255 }
                location: { type: string, maxLength: 255 }
                type:
                  type: string
                  enum: ["présentiel","télétravail","hybride"]
                duration_unit:
                  type: string
                  enum: ["weeks","months"]
                duration_value:
                  type: integer
                  minimum: 1
                required_skills:
                  type: array
                  items:
                    type: string
                deadline:
                  type: string
                  format: date
      responses:
        '201':
          description: Offer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  offer:
                    $ref: '#/components/schemas/InternshipOffer'
        '401':
          description: Unauthenticated
        '422':
          description: Validation error
  /api/company/offers/{id}:
    put:
      tags: ["Company"]
      summary: Update an existing internship offer (company only, must own offer)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: string }
                domain: { type: string, maxLength: 255 }
                location: { type: string, maxLength: 255 }
                type:
                  type: string
                  enum: ["présentiel","télétravail","hybride"]
                duration_unit:
                  type: string
                  enum: ["weeks","months"]
                duration_value:
                  type: integer
                  minimum: 1
                required_skills:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                  enum: ["open","closed"]
                deadline:
                  type: string
                  format: date
      responses:
        '200':
          description: Offer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  offer:
                    $ref: '#/components/schemas/InternshipOffer'
        '401':
          description: Unauthenticated
        '404':
          description: Offer not found or not owned by the company
  /api/student/offers/{id}/apply:
    post:
      tags: ["Student"]
      summary: Apply to an internship offer (student only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cover_letter:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  application:
                    $ref: '#/components/schemas/Application'
        '404':
          description: Offer not found or not open
        '409':
          description: Student has already applied to this offer
  /api/student/applications:
    get:
      tags: ["Student"]
      summary: List applications of the authenticated student
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated list of the student's applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                  current_page: { type: integer }
                  last_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
  /api/student/applications/{id}:
    delete:
      tags: ["Student"]
      summary: Cancel a pending application (student only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Application cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '403':
          description: Only pending applications can be cancelled
        '404':
          description: Application not found
  /api/company/offers/{id}/applications:
    get:
      tags: ["Company"]
      summary: List applications for a specific offer owned by the authenticated company
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Paginated list of applications for the offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                  current_page: { type: integer }
                  last_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
        '404':
          description: Offer not found or not owned by the company
  /api/company/applications/{id}/accept:
    put:
      tags: ["Company"]
      summary: Accept a student's application (company only, must own offer)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Application accepted, awaiting admin validation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  application:
                    $ref: '#/components/schemas/Application'
        '403':
          description: Only pending applications can be accepted
        '404':
          description: Application not found or not owned by the company
  /api/company/applications/{id}/refuse:
    put:
      tags: ["Company"]
      summary: Refuse a student's application (company only, must own offer)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Application refused
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  application:
                    $ref: '#/components/schemas/Application'
        '403':
          description: Only pending applications can be refused
        '404':
          description: Application not found or not owned by the company
  /api/admin/applications:
    get:
      tags: ["Admin"]
      summary: List applications for administration (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: ["pending","accepted","refused","validated","rejected"]
          description: Optional filter by application status
      responses:
        '200':
          description: Paginated list of applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                  current_page: { type: integer }
                  last_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
  /api/admin/applications/pending:
    get:
      tags: ["Admin"]
      summary: List applications pending validation (status=accepted) for admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated list of accepted applications awaiting validation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                  current_page: { type: integer }
                  last_page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
  /api/admin/applications/{id}/validate:
    put:
      tags: ["Admin"]
      summary: Validate an accepted application (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Application validated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  application:
                    $ref: '#/components/schemas/Application'
        '404':
          description: Application not found or not in accepted status
  /api/admin/applications/{id}/convention:
    get:
      tags: ["Admin", "Conventions"]
      summary: Generate and download Convention de Stage PDF for a validated application (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Convention de Stage PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Application not found or not in validated status
  /api/conventions/{id}/download:
    get:
      tags: ["Conventions"]
      summary: Download Convention de Stage PDF
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Convention de Stage PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden
        '404':
          description: Convention not found
  /api/student/convention:
    get:
      tags: ["Student", "Conventions"]
      summary: Get current student's convention metadata
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Convention found
        '404':
          description: No convention found yet
  /api/admin/conventions:
    get:
      tags: ["Admin", "Conventions"]
      summary: List all conventions (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated list of conventions
  /api/admin/applications/{id}/reject:
    put:
      summary: Reject an accepted application (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Application rejected by administration
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  application:
                    $ref: '#/components/schemas/Application'
        '404':
          description: Application not found or not in accepted status
  /api/admin/stats:
    get:
      summary: Global statistics for applications and offers (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistics for the platform
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_applications: { type: integer }
                  pending: { type: integer }
                  accepted: { type: integer }
                  refused: { type: integer }
                  validated: { type: integer }
                  rejected: { type: integer }
                  total_offers: { type: integer }
                  open_offers: { type: integer }
                  students_placed: { type: integer }
    delete:
      summary: Delete an internship offer (company only, must own offer)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Offer deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401':
          description: Unauthenticated
        '404':
          description: Offer not found or not owned by the company
